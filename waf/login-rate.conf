# Loaded in http context by the pinned CRS image. Only login POSTs consume budget.
# The original TCP peer remains authoritative even if a Real-IP header is forged.
map "$request_method:$uri" $login_rate_key {
    default "";
    "POST:/login" $realip_remote_addr;
}
limit_req_zone $login_rate_key zone=portal_login:1m rate=12r/m;
limit_req zone=portal_login burst=4 nodelay;
limit_req_status 429;
limit_req_log_level error;

map $limit_req_status $login_retry_after {
    default "";
    REJECTED "25";
}
add_header Retry-After $login_retry_after always;

map $login_rate_key $log_login_attempt { "" 0; default 1; }
log_format login_limits 'LOGIN_LIMIT peer=$realip_remote_addr method=$request_method uri=$uri status=$status limit=$limit_req_status';
access_log /dev/stdout login_limits if=$log_login_attempt;
