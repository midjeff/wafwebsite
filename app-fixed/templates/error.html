{% extends 'base.html' %}{% block content %}<section class="card error-card"><p class="eyebrow">{{ error.code }}</p><h1>{% if error.code == 403 %}Нет доступа к этой заявке{% elif error.code == 404 %}Страница не найдена{% else %}Не удалось выполнить запрос{% endif %}</h1><p>{{ error.description }}</p><a class="button" href="{{ url_for('dashboard') }}">Вернуться к обзору →</a></section>{% endblock %}
