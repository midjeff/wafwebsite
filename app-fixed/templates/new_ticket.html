{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">IT-ПОДДЕРЖКА</p><h1>Чем мы можем помочь?</h1><p class="muted">Расскажите, что случилось. Детали помогут быстрее найти решение.</p></div></div><section class="card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Тема заявки</label><input id="title" name="title" maxlength="150" placeholder="Например, подключить второй монитор" required><div class="form-row"><div><label for="category">Категория</label><select id="category" name="category">{% for option in ['Оборудование','Программы','Доступы','Сеть'] %}<option>{{ option }}</option>{% endfor %}</select></div><div><label for="priority">Приоритет</label><select id="priority" name="priority"><option>Обычный</option><option>Низкий</option><option>Высокий</option></select></div></div><label for="body">Описание</label><textarea id="body" name="body" rows="6" maxlength="4000" placeholder="Что не работает? Когда возникла проблема?" required></textarea><div class="form-actions"><button class="button">Отправить заявку →</button><a href="{{ url_for('tickets') }}">Отмена</a></div></form></section>{% endblock %}
